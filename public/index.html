<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cosinfo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="script.js"></script>
</head>
<body>
    <!-- 상단 바 -->
    <div class="menu-bar-wrap">
      <div class="menu-bar">
        <a href="index.html"><h3>cosinfo</h3></a>
        <div class="menu-bar-inner">
          <a href="mypage.html">마이 페이지</a>
          <a href="Login.html">로그인</a>
        </div>
      </div>
    </div>
    <div id="search-box">
        <h1>어떤 성분을 찾고 있나요?</h1>
        <div id="search-bar">
            <input type="search" id="search" onkeydown="if(event.key === 'Enter') redirectToChat()" placeholder="성분명 입력...">
            <!-- 검색 버튼 -->
            <button type="submit" onclick="redirectToChat()" style="height: 40px;">
              <i class="fa-solid fa-magnifying-glass" style="color: #000;"></i>
            </button>
            
            <script>
            function redirectToChat() {
              const input = document.getElementById("search").value.trim();
              if (!input) return;
              window.location.href = `gpt-chat.html?query=${encodeURIComponent(input)}`;
            }
            </script>
        </div>
    </div>
</body>
</html>
