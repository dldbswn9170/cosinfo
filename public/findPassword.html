<!DOCTYPE html>
<html lang="ko">

    <body id="find-password-page">
  <!-- 상단 바 -->
  <div class="menu-bar-wrap">

      <a href="index.html"><h3>cosinfo</h3></a>

        <!-- 비밀번호 찾기 폼 -->
        <div class="login-box">
            <form class="login-form" id="findPasswordForm">
                <label>이메일</label><br>
                <input id="email" type="email" name="email" placeholder="이메일을 입력하세요" required><br>
                
                <!-- 찾은 비밀번호 표시 -->
                <p id="result"></p>
                
                <button class="find-password-button" type="submit">비밀번호 찾기</button><br>
                <div class="login-links">
                    <!-- 로그인 링크 -->
                    <a href="Login.html">로그인 하러 가기</a>
                </div>
            </form>
        </div>
