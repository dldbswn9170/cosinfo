<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이페이지 | cosinfo</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>
<body>
  <!-- 상단 바 -->
  <div class="menu-bar-wrap">
    <div class="menu-bar">
      <h3 onclick="location.href='index.html'">cosinfo</h3>
      <div class="menu-bar-inner">
        <a href="#">마이 페이지</a>
        <a href="#">로그아웃</a>
      </div>
    </div>
  </div>

  <!-- 프로필 정보 -->
  <section class="profile-section">
    <i class="fa-solid fa-user fa-3x"></i>
    <p class="greeting" id="user-greeting">안녕하세요, 사용자님</p>
    <p class="email" id="user-email">useremail@gmail.com</p>
    <div class="profile-buttons">
      <button id="bookmark-tab" class="active">북마크</button>
      <button id="edit-tab">정보 수정</button>
    </div>
  </section>

  <!-- 북마크 카드 -->
  <section class="card-section">
    <div class="card">
      <div class="card-header">
        <strong>나이아신아마이드</strong>
        <button class="close-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p class="card-content">
        나이아신아마이드(Niacinamide)는 비타민 B3의 한 형태로, 피부 관리에서 매우 인기 있는 성분이에요,...
      </p>
    </div>
  </section>
  <!-- 정보 수정 폼 (초기엔 숨김 처리) -->
  <section class="edit-section" style="display: none;">
    <form>
      <h3>정보 수정</h3>
      <label>사용자 이름</label>
      <input type="text" name="username" /><br /><br />
      <label>사용자 아이디</label>
      <input type="text" name="user_id" /><br /><br />
      <label>비밀번호</label><br />
      <input type="password" name="password" /><br /><br />
      <label>이메일</label><br />
      <input type="email" name="email" /><br /><br />
      <button type="submit">저장</button>
    </form>
  </section>
  <script src="mypage.js"></script>
</body>
</html>
