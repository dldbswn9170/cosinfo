<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cosinfo 로그인</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body id="login-page">
    <!-- 메뉴 -->
    <div class="menu-bar-wrap">
        <div class="menu-bar">
            <h3 onclick="location.href='index.html'">cosinfo</h3>
            <div class="menu-bar-inner">
                <a href="#" id="mypage-link">마이 페이지</a>
                <a href="login.html" id="login-link">로그인</a>
            </div>
        </div>
    </div>

    <main>
        <!-- 로그인 폼 -->
        <div class="login-box">
            <form class="login-form" id="loginForm">
                <label>아이디</label><br>
                <input name="user_id" type="text" placeholder="아이디를 입력하세요" required><br>

                <label>비밀번호</label><br>
                <input name="password" type="password" placeholder="비밀번호를 입력하세요" required><br>
                
                <input type="hidden" name="redirect" id="redirect" value="index.html">
                <button class="login-button" type="submit">로그인</button><br>
                <br>
                <div class="login-links">
                    <!-- 비밀번호 찾기 링크 -->
                    <a href="find_Password.html">비밀번호를 잊으셨나요?</a><br>
                    <!-- 회원가입 링크 -->
                    <a href="register.html">계정이 없나요? 회원가입 하러 가기</a>
                </div>
                <br>
            </form>
        </div>
    </main>

    <footer>
        <p style="text-align: center; margin-top: 100px;">© cosinfo</p>
    </footer>
</body>
</html>
