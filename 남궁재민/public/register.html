<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>cosinfo 회원가입</title>
        <link rel="stylesheet" href="style.css">
        <script defer src="script.js"></script>
    </head>
    <body id="register-page">
        <!-- 메뉴 -->
        <div class="menu-bar-wrap">
            <div class="menu-bar">
                <h3 onclick="location.href='index.html'">cosinfo</h3>
                <div class="menu-bar-inner">
                    <a href="mypage.html">마이페이지</a>
                    <a href="login.html">로그인</a>
                </div>
            </div>
        </div>
        
        <!-- 회원가입 폼 --> 
        <div class="login-box">
            <form class="login-form" id="registerForm">
                <label>아이디</label><br>
                <input name="user_id" type="text" placeholder="이메일을 입력하세요" required><br>
                
                <label>이메일</label><br>
                <input name="email" type="email" placeholder="이메일을 입력하세요" required><br>
    
                <label>이름</label><br>
                <input name="username" type="text" placeholder="이름을 입력하세요" required><br>
    
                <label>비밀번호</label><br>
                <input name="password" type="password" placeholder="비밀번호를 입력하세요" required><br>
    
                <label>비밀번호 확인</label><br>
                <input name="confirm-password" type="password" placeholder="비밀번호를 다시 입력하세요" required><br>
    
                <button class="register-button" type="submit">회원가입</button><br>
                <div class="login-links">
                    <a href="login.html">이미 계정이 있나요? 로그인 하러 가기</a>
                </div>
            </form>
        </div>
    </body>
</html>
