<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cosinfo</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <!-- 메뉴 -->
    <div class="menu-bar-wrap">
      <div class="menu-bar">
        <h3 onclick="location.href='Main.html'">cosinfo</h3>
        <div class="menu-bar-inner">
          <a href="Mypage.html">마이페이지</a>
          <a href="Login.html">로그인</a>
        </div>
      </div>
    </div>

    <!-- 회원가입 폼 -->
    <div class="login-box">
      <form class="login-form" id="register-form">
        <label>사용자 이름</label><br />
        <input name="username" type="text" placeholder="이름을 입력하세요" /><br />

        <label>사용자 아이디</label><br />
        <input name="user_id" type="text" placeholder="아이디를 입력하세요" /><br />

        <label>비밀번호</label><br />
        <input name="password" type="password" placeholder="비밀번호를 입력하세요" /><br />

        <label>이메일</label><br />
        <input name="email" type="email" placeholder="이메일을 입력하세요" /><br />

        <button class="register-button" type="submit">회원가입</button><br />
        <div class="login-links">
          <a href="Login.html">이미 계정이 있나요? 로그인 하러 가기</a>
        </div>
      </form>
    </div>
  </body>
</html>
